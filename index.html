<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quicknotes</title>

  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>

</head>

<body>
  <main class="container">
    <header>
      <h1>QuickNotes</h1>
      <p>Your simple notes appliction</p>
    </header>

    <section class="controls">
      <button id="load-btn" type="button">
        Load notes
      </button>

      <p id="status" role="status" aria-live="polite">
        Ready to load notes
      </p>
    </section>

    <section class="create-section">
      <h2>Create a Note</h2>

    <form id="note-form">

      <div class="form-group">
        <label for="title-input">
          Note title
        </label>

        <input 
            type="text"
            id="title-input"
            maxlength="100"
            required
            placeholder="Enter your note title"
            >
      </div>

      <div class="form-group">
        <label for="body-input">
          Note body
        </label>
      </div>
      <textarea
            id="body-input"
            rows="5"
            placeholder="write your note here(optional)"
      ></textarea>

      <button id="submit-btn" type="submit">
        Create note
      </button>

    </form>

    </section>

    <section class="note-section">
      <h2>Your notes</h2>

      <ul id="note-list"></ul>
    </section>

  </main>
  
</body>
</html>
